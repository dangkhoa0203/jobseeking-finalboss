name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Approve native build scripts
        run: pnpm approve-builds --all
      - name: Rebuild native dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
        env:
          VITE_API_BASE: https://jobseeking-finalboss.onrender.com
          # Served from a /jobseeking-finalboss/ subpath on GitHub Pages, not the domain root.
          BASE_PATH: /jobseeking-finalboss/
      - name: SPA fallback for client-side routes
        # GitHub Pages has no server-side rewrites — a direct hit or refresh on /login etc.
        # 404s otherwise, since only index.html actually exists as a file. Pages' documented
        # workaround: serve the same shell as 404.html, letting React Router take over once
        # the JS bundle loads and reads the real path.
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
